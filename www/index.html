<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f5c4d"><link rel="icon" href="icon-192.png"><title>بهداری FAC – ثبت مراجعات HSE</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3f2;--card:#fff;--tx:#14201e;--mut:#5d6f6b;--pri:#0f5c4d;--pri2:#0a3d33;--acc:#f2a900;--bd:#d3dedb;--ok:#e3f1ee;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1716;--card:#162321;--tx:#e6efed;--mut:#93a8a3;--pri:#2fa88f;--pri2:#0a3d33;--bd:#2b3f3b;--ok:#1b3a35}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1716;--card:#162321;--tx:#e6efed;--mut:#93a8a3;--pri:#2fa88f;--pri2:#0a3d33;--bd:#2b3f3b;--ok:#1b3a35}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px Tahoma,Arial,sans-serif}
*{box-sizing:border-box}
header{background:linear-gradient(135deg,var(--pri2),#0f5c4d);color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;border-bottom:4px solid var(--acc)}
.logo{width:42px;height:42px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none}
header h1{font-size:16px;margin:0}header small{opacity:.85;font-size:11px}
main{padding:12px 12px 90px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:14px;margin:0 0 10px;color:var(--pri);border-right:4px solid var(--acc);padding-right:8px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--pri);color:#fff;font-weight:bold;cursor:pointer}
button.s{background:var(--ok);color:var(--pri)}button.d{background:transparent;color:var(--bad);padding:4px 8px}
.row{display:flex;gap:8px}.row>*{flex:1}
nav{position:fixed;bottom:0;right:0;left:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:11px;padding:9px 2px}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--acc)}
.mr{display:grid;grid-template-columns:1fr 80px 36px;gap:6px;margin-top:6px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}
th{background:var(--pri2);color:#fff;padding:7px;white-space:nowrap}td{border:1px solid var(--bd);padding:6px;text-align:center}
.rec{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--card)}
.rec b{color:var(--pri)}.rec p{margin:4px 0;color:var(--mut);font-size:12px}
.kpi{display:flex;gap:8px;margin-bottom:10px}.kpi div{flex:1;background:var(--ok);border-radius:10px;padding:10px;text-align:center;color:var(--pri);font-size:11px}.kpi b{display:block;font-size:20px}
.toast{position:fixed;top:70px;right:50%;transform:translateX(50%);background:var(--pri2);color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9}
.v{display:none}.v.on{display:block}
</style></head><body>
<header><div class="logo"><svg width="28" height="28" viewBox="0 0 24 24"><path fill="#0f5c4d" d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></div>
<div><h1>بهداری FAC — ثبت مراجعات کمک‌های اولیه</h1><small>HSE | آسیب جزئی، بدون نیاز به استراحت بیش از ۱ روز</small></div></header>
<main>
<section id="v-add" class="v on"><div class="card"><h2>ثبت مراجعه جدید</h2>
<div class="g2"><div><label>تاریخ (شمسی)</label><input id="date" inputmode="numeric"></div><div><label>ساعت مراجعه</label><input id="time" type="time"></div></div>
<label>نام و نام خانوادگی</label><input id="name"><div class="g2"><div><label>سن</label><input id="age" type="number" inputmode="numeric"></div><div><label>بلوک</label><input id="block" list="dl-block"></div></div>
<label>محل وقوع</label><input id="loc"><label>نوع آسیب</label><input id="injury" list="dl-injury"><label>علت آسیب</label><input id="cause" list="dl-cause">
<label>شرح جزئی رویداد</label><textarea id="desc" rows="2"></textarea><label>خدمات انجام شده</label><input id="svc" list="dl-svc">
<label>مواد مصرفی</label><div id="mrows"></div><button class="s" style="margin-top:8px;width:100%" onclick="addMr()">＋ افزودن ماده</button>
<button style="width:100%;margin-top:12px" onclick="save()">ذخیره مراجعه</button></div></section>

<section id="v-list" class="v"><div class="card"><h2>سوابق مراجعات</h2><input id="q" placeholder="جستجوی نام، آسیب، بلوک…" oninput="list()"><div id="recs" style="margin-top:10px"></div></div></section>

<section id="v-rep" class="v"><div class="card"><h2>گزارش مصرف مواد</h2>
<div class="g2"><div><label>سال</label><select id="ry" onchange="rep()"></select></div><div><label>ماه</label><select id="rm" onchange="rep()"></select></div></div>
<div id="rep" style="margin-top:10px;background:var(--card)"></div>
<div class="row" style="margin-top:12px"><button onclick="xl()">خروجی Excel</button><button onclick="pdf()">خروجی PDF</button></div></div></section>

<section id="v-mat" class="v"><div class="card"><h2>فهرست مواد کمک‌های اولیه</h2>
<div class="mr" style="grid-template-columns:1fr 90px 60px"><input id="mn" placeholder="نام ماده"><input id="mu" placeholder="واحد"><button onclick="addMat()">＋</button></div><div id="mats" style="margin-top:8px"></div></div>
<div class="card"><h2>لیست‌های پایه (هر مورد در یک خط)</h2><div id="lists"></div></div></section>
</main>
<div class="toast" id="toast"></div>
<nav><button class="on" data-v="add">ثبت</button><button data-v="list">سوابق</button><button data-v="rep">گزارش</button><button data-v="mat">مواد و لیست‌ها</button></nav>
<datalist id="dl-block"></datalist><datalist id="dl-injury"></datalist><datalist id="dl-cause"></datalist><datalist id="dl-svc"></datalist>
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/html2canvas.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id),MONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mem={};const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):(mem[k]??d)}catch(e){return mem[k]??d}},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEF={injury:["بریدگی","خراشیدگی / سایش","کوفتگی","سوختگی سطحی","جسم خارجی در چشم","پیچ‌خوردگی خفیف","تماس با مواد شیمیایی","فرو رفتن جسم خارجی"],
cause:["برخورد با جسم سخت","لغزش / سقوط","گیر کردن دست یا انگشت","پرتاب ذرات","تماس با سطح داغ","تماس با مواد شیمیایی","ابزار دستی","ابزار برقی","حمل بار","لبه تیز"],
block:["بلوک A","بلوک B","بلوک C","بلوک D","محوطه"],svc:["شست‌وشوی زخم","ضدعفونی و پانسمان","بانداژ","شست‌وشوی چشم","کمپرس سرد","آتل‌بندی موقت"]};
const LN={injury:"نوع آسیب",cause:"علت آسیب",block:"بلوک",svc:"خدمات"};
let L=st.get("lists",DEF),M=st.get("mats",[["باند پانسمان","عدد"],["گاز استریل","بسته"],["چسب زخم","عدد"],["پنبه","بسته"],["بتادین","میلی‌لیتر"],["سرم شستشو","میلی‌لیتر"],["قطره چشم تتراکایین","قطره"],["پماد سوختگی","لوله"],["آتل","عدد"],["دستکش یکبار مصرف","جفت"]]),R=st.get("recs",[]);
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2500)}
function today(){const p=new Intl.DateTimeFormat("en-u-ca-persian-nu-latn",{year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()),g=t=>p.find(x=>x.type===t).value;return g("year")+"/"+g("month")+"/"+g("day")}
const nd=s=>String(s).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/-/g,"/");
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x==b));document.querySelectorAll(".v").forEach(v=>v.classList.toggle("on",v.id=="v-"+b.dataset.v));if(b.dataset.v=="list")list();if(b.dataset.v=="rep")rep();scrollTo(0,0)});
function dls(){for(const k in LN)$("dl-"+k).innerHTML=L[k].map(x=>`<option value="${esc(x)}">`).join("")}
function addMr(n="",q=""){const d=document.createElement("div");d.className="mr";d.innerHTML=`<select><option value="">ماده…</option>${M.map(m=>`<option ${m[0]==n?"selected":""}>${esc(m[0])}</option>`).join("")}</select><input type="number" step="any" inputmode="decimal" placeholder="تعداد" value="${q}"><button class="d" onclick="this.parentNode.remove()">✕</button>`;$("mrows").appendChild(d)}
function reset(){["name","age","block","loc","injury","cause","desc","svc"].forEach(i=>$(i).value="");$("date").value=today();const n=new Date();$("time").value=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");$("mrows").innerHTML="";addMr()}
function save(){const date=nd($("date").value.trim());if(!/^\d{4}\/\d{2}\/\d{2}$/.test(date)||+date.slice(5,7)<1||+date.slice(5,7)>12)return toast("تاریخ را به شکل 1405/09/06 وارد کنید");
if(!$("name").value.trim())return toast("نام و نام خانوادگی الزامی است");
const mats=[...$("mrows").children].map(r=>({n:r.children[0].value,q:+r.children[1].value})).filter(m=>m.n||m.q);
if(mats.some(m=>!m.n||!(m.q>0)))return toast("برای هر ماده، نام و تعداد (بزرگ‌تر از صفر) وارد کنید");
R.push({id:Date.now(),date,time:$("time").value,name:$("name").value.trim(),age:$("age").value,block:$("block").value,loc:$("loc").value,injury:$("injury").value,cause:$("cause").value,desc:$("desc").value,svc:$("svc").value,mats});
st.set("recs",R);toast("✔ مراجعه ذخیره شد");reset()}
function list(){const q=$("q").value.trim(),a=R.slice().reverse().filter(r=>!q||[r.name,r.injury,r.cause,r.block,r.loc].join(" ").includes(q));
$("recs").innerHTML=a.map(r=>`<div class="rec"><b>${esc(r.name)}</b> <span style="color:var(--mut)">${esc(r.age?r.age+" ساله":"")}</span><p>${esc(r.date)} – ${esc(r.time)} | ${esc(r.block)} ${esc(r.loc)}</p><p>${esc(r.injury)} ← ${esc(r.cause)}</p><p>خدمات: ${esc(r.svc)} | مواد: ${esc(r.mats.map(m=>m.n+" ×"+m.q).join("، ")||"—")}</p><button class="d" onclick="del(${r.id})">حذف</button></div>`).join("")||"<p>مورد ثبت‌شده‌ای نیست.</p>"}
function del(id){if(!confirm("این مراجعه حذف شود؟"))return;R=R.filter(r=>r.id!=id);st.set("recs",R);list()}
function addMat(){const n=$("mn").value.trim();if(!n)return;if(M.some(m=>m[0]==n))return toast("نام تکراری است");M.push([n,$("mu").value.trim()]);st.set("mats",M);$("mn").value=$("mu").value="";mats()}
function mats(){$("mats").innerHTML=M.map((m,i)=>`<div class="rec" style="display:flex;justify-content:space-between;align-items:center;margin:4px 0"><span>${esc(m[0])} <small style="color:var(--mut)">(${esc(m[1])})</small></span><button class="d" onclick="M.splice(${i},1);st.set('mats',M);mats()">حذف</button></div>`).join("");
$("lists").innerHTML=Object.keys(LN).map(k=>`<label>${LN[k]}</label><textarea rows="4" onchange="L['${k}']=this.value.split('\\n').map(x=>x.trim()).filter(Boolean);st.set('lists',L);dls()">${esc(L[k].join("\n"))}</textarea>`).join("")}
function per(){const y=$("ry").value,m=$("rm").value;return R.filter(r=>r.date.slice(0,4)==y&&+r.date.slice(5,7)==+m)}
function sum(){const o={};per().forEach(r=>{const seen=new Set();r.mats.forEach(x=>{o[x.n]=o[x.n]||{q:0,v:0,w:[]};o[x.n].q+=x.q;if(!seen.has(x.n)){o[x.n].v++;seen.add(x.n)}o[x.n].w.push([r,x.q])})});return o}
const unit=n=>(M.find(m=>m[0]==n)||[0,""])[1];
function rep(){const o=sum(),p=per(),sel=window.selMat||"";
$("rep").innerHTML=`<div class="kpi"><div><b>${p.length}</b>مراجعه در ${esc(MONTHS[$("rm").value-1])} ${esc($("ry").value)}</div><div><b>${Object.keys(o).length}</b>قلم ماده مصرفی</div></div>
<div class="sc"><table><tr><th>ماده</th><th>مصرف</th><th>واحد</th><th>تعداد مراجعه</th></tr>${Object.keys(o).map(n=>`<tr onclick="selMat='${esc(n).replace(/'/g,"")}';rep()" style="cursor:pointer"><td>${esc(n)}</td><td><b>${o[n].q}</b></td><td>${esc(unit(n))}</td><td>${o[n].v}</td></tr>`).join("")||'<tr><td colspan="4">مصرفی ثبت نشده است</td></tr>'}</table></div>
<p style="color:var(--mut);font-size:11px">برای دیدن ریز مصرف، روی نام ماده بزنید یا انتخاب کنید:</p>
<select onchange="selMat=this.value;rep()" data-h="1"><option value="">— ماده —</option>${M.map(m=>`<option ${m[0]==sel?"selected":""}>${esc(m[0])}</option>`).join("")}</select>
${sel&&o[sel]?`<h2 style="margin-top:12px">ریز مصرف «${esc(sel)}»: ${o[sel].q} ${esc(unit(sel))}</h2><div class="sc"><table><tr><th>نام</th><th>تاریخ</th><th>آسیب</th><th>علت</th><th>مقدار</th></tr>${o[sel].w.map(([r,q])=>`<tr><td>${esc(r.name)}</td><td>${esc(r.date)}</td><td>${esc(r.injury)}</td><td>${esc(r.cause)}</td><td>${q}</td></tr>`).join("")}</table></div>`:sel?"<p>در این ماه مصرفی نداشته است.</p>":""}`}
async function out(name,data){const C=window.Capacitor;
if(C&&C.isNativePlatform&&C.isNativePlatform()){try{const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(data)});
const w=await C.Plugins.Filesystem.writeFile({path:name,data:b64,directory:"CACHE"});
await C.Plugins.Share.share({title:name,url:w.uri,dialogTitle:"ذخیره یا ارسال فایل"})}catch(e){if(!/cancel/i.test(String(e&&e.message)))toast("خطا در ذخیره فایل")}return}
const a=document.createElement("a");a.href=URL.createObjectURL(data);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("✔ فایل دانلود شد")}
function xl(){const o=sum(),wb=XLSX.utils.book_new(),mn=MONTHS[$("rm").value-1]+" "+$("ry").value;
const a=[["ردیف","تاریخ","ساعت","نام و نام خانوادگی","سن","بلوک","محل وقوع","نوع آسیب","علت آسیب","شرح","خدمات","مواد مصرفی"]].concat(R.map((r,i)=>[i+1,r.date,r.time,r.name,+r.age||"",r.block,r.loc,r.injury,r.cause,r.desc,r.svc,r.mats.map(m=>m.n+" ×"+m.q).join("، ")]));
const b=[["گزارش مصرف – "+mn],["ماده","مصرف","واحد","تعداد مراجعه"]].concat(Object.keys(o).map(n=>[n,o[n].q,unit(n),o[n].v]));
const c=[["ماده","نام","تاریخ","آسیب","علت","مقدار","واحد"]];Object.keys(o).forEach(n=>o[n].w.forEach(([r,q])=>c.push([n,r.name,r.date,r.injury,r.cause,q,unit(n)])));
[["ثبت مراجعات",a],["گزارش مصرف",b],["ریز مصرف",c]].forEach(([n,d])=>{const s=XLSX.utils.aoa_to_sheet(d);s["!cols"]=d[Math.min(1,d.length-1)].map(()=>({wch:20}));XLSX.utils.book_append_sheet(wb,s,n)});wb.Workbook={Views:[{RTL:true}]};
out("FAC-firstaid-"+$("ry").value+"-"+$("rm").value+".xlsx",new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})]))}
async function pdf(){try{const sel=document.querySelector("#rep select");sel.style.display="none";const cv=await html2canvas($("rep"),{scale:2,backgroundColor:"#ffffff"});sel.style.display="";
const {jsPDF}=window.jspdf,p=new jsPDF("p","mm","a4"),W=190,H=cv.height*W/cv.width,pg=270;p.setFontSize(9);let y=0;
while(y<H){const sh=Math.min(pg,H-y),s=document.createElement("canvas");s.width=cv.width;s.height=sh*cv.width/W;s.getContext("2d").drawImage(cv,0,y*cv.width/W,cv.width,s.height,0,0,cv.width,s.height);p.addImage(s.toDataURL("image/jpeg",.92),"JPEG",10,12,W,sh);y+=pg;if(y<H)p.addPage()}
out("FAC-firstaid-report-"+$("ry").value+"-"+$("rm").value+".pdf",p.output("blob"))}catch(e){toast("خطا در ساخت PDF")}}
(function init(){const y=+today().slice(0,4);$("ry").innerHTML=[y-1,y,y+1].map(v=>`<option ${v==y?"selected":""}>${v}</option>`).join("");
$("rm").innerHTML=MONTHS.map((m,i)=>`<option value="${i+1}" ${i+1==+today().slice(5,7)?"selected":""}>${m}</option>`).join("");dls();mats();reset()})();
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
